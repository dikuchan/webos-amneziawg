<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AmneziaWG</title>
  <style>
    @font-face { font-family:Inter; src:url("fonts/Inter-Regular.woff2") format("woff2"); font-style:normal; font-weight:400; font-display:swap; }
    @font-face { font-family:Inter; src:url("fonts/Inter-Medium.woff2") format("woff2"); font-style:normal; font-weight:500; font-display:swap; }
    @font-face { font-family:"JetBrains Mono"; src:url("fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-style:normal; font-weight:400; font-display:swap; }
    :root { --bg:#121113; --panel:#1a191b; --control:#232225; --hover:#2b292d; --border:#3c393f; --text:#eeeef0; --muted:#b5b2bc; --accent:#5b5bd6; --focus:#b1a9ff; --error:#ff9592; --tool-size:84px; --tool-slot:176px; --counter-width:196px; --toolbar-gap:32px; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:var(--bg); color:var(--text); font:400 28px/1.35 Inter,Arial,sans-serif; }
    button { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text); background:var(--control); border:2px solid transparent; cursor:pointer; font:inherit; }
    button:focus { outline:4px solid var(--focus); outline-offset:8px; background:var(--hover); }
    button[aria-disabled="true"] { opacity:.5; cursor:default; }
    .icon { display:block; width:34px; height:34px; flex-shrink:0; }
    main { height:100%; padding:62px 96px 52px; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; font-size:30px; font-weight:500; letter-spacing:-.6px; }
    header img { width:62px; height:62px; margin-right:18px; }
    .connection { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:22px; }
    #primary { width:212px; height:212px; border-radius:50%; border:2px solid var(--border); color:var(--muted); }
    #primary .icon { width:80px; height:80px; }
    [data-state="connected"] #primary { background:var(--accent); color:var(--text); border-color:var(--accent); }
    [data-state="connected"] #primary:focus { background:#6e6ade; }
    #primary[aria-busy="true"] .icon { animation:pending 1.4s ease-in-out infinite; }
    @keyframes pending { 50% { opacity:.35; } }
    h1 { font-size:32px; line-height:1.3; font-weight:500; margin:34px 0 0; color:var(--muted); }
    [data-state="connected"] h1 { color:var(--text); }
    #notice { color:var(--muted); font-size:24px; line-height:1.4; height:34px; margin:16px 0 0; text-align:center; }
    #notice[data-kind="error"] { color:var(--error); }
    .toolbar { display:grid; grid-template-columns:repeat(3,var(--tool-slot)); column-gap:var(--toolbar-gap); justify-content:center; padding-bottom:50px; }
    .traffic { display:grid; grid-template-columns:repeat(2,var(--counter-width)); column-gap:48px; margin-top:30px; }
    .traffic-cell { display:flex; height:40px; align-items:center; justify-content:center; white-space:nowrap; font-size:28px; font-weight:500; font-variant-numeric:tabular-nums; }
    .traffic-cell .icon { color:var(--focus); width:28px; height:28px; margin-right:14px; }
    .tool { position:relative; display:flex; flex-direction:column; align-items:center; min-width:0; }
    .icon-button { width:var(--tool-size); height:var(--tool-size); border-radius:20px; color:var(--muted); }
    .icon-button:focus { color:var(--text); }
    .caption { position:absolute; top:100%; width:220px; text-align:center; white-space:nowrap; font-size:23px; color:var(--muted); line-height:32px; margin-top:18px; opacity:0; }
    button:focus + .caption { opacity:1; }
    .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9,8,10,.9); display:flex; align-items:center; justify-content:center; padding:64px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:28px; width:1100px; max-height:100%; padding:48px 56px; display:flex; flex-direction:column; }
    h2 { margin:0 0 38px; font-size:40px; font-weight:500; letter-spacing:-.7px; flex-shrink:0; }
    .panel p { font-size:27px; color:var(--muted); line-height:1.5; margin:0 0 22px; }
    .upload-url { display:block; margin-top:24px; font:400 36px/1.5 "JetBrains Mono",monospace; color:var(--focus); }
    .upload-pin { display:flex; align-items:center; margin:34px 0; color:var(--muted); font-size:26px; }
    .upload-pin code { font:400 52px/1.4 "JetBrains Mono",monospace; color:var(--text); margin-left:32px; letter-spacing:3px; }
    #upload-message { margin-top:22px; font-size:24px; }
    #upload-message[data-kind="error"] { color:var(--error); }
    .routing-info { display:flex; align-items:center; justify-content:space-between; gap:18px; margin:-4px 0 16px; padding:0 16px 0 28px; color:var(--muted); font-size:22px; }
    .routing-info .icon-button { width:60px; height:60px; border-radius:14px; }
    .routing-info .icon { width:28px; height:28px; }
    #routing-refresh[aria-busy="true"] .icon { animation:pending 1.4s ease-in-out infinite; }
    .path { font:400 26px/1.5 "JetBrains Mono",monospace; color:var(--text); background:var(--control); border-radius:14px; padding:24px 28px; }
    .panel-actions { display:flex; justify-content:flex-end; flex-shrink:0; padding:10px 10px 50px; margin-top:36px; }
    .panel-actions .tool { min-width:134px; }
    .panel-actions .tool + .tool { margin-left:16px; }
    .panel-actions .caption { margin-top:12px; }
    #log-panel { height:820px; }
    #log-output { flex:1; min-height:0; overflow-y:auto; margin:0; padding:0 16px 0 0; white-space:pre-wrap; overflow-wrap:break-word; color:var(--muted); font:400 23px/1.6 "JetBrains Mono",monospace; font-variant-ligatures:none; }
    .setting-row { width:100%; min-height:100px; padding:22px 28px; margin-bottom:16px; border-radius:16px; justify-content:space-between; font-size:28px; text-align:left; }
    .language-value { color:var(--focus); margin-left:28px; font-weight:500; }
    .switch { width:70px; height:40px; border-radius:24px; background:var(--border); padding:6px; margin-left:32px; }
    .switch::after { content:""; display:block; width:28px; height:28px; border-radius:50%; background:var(--muted); }
    [aria-checked="true"] .switch { background:var(--accent); }
    [aria-checked="true"] .switch::after { background:var(--text); margin-left:30px; }
    #settings-notice:empty { display:none; }
    #settings-notice { min-height:38px; margin:26px 0 0; color:var(--error); font-size:24px; }
    @media (max-height:800px) {
      :root { --tool-size:70px; --tool-slot:148px; --counter-width:160px; --toolbar-gap:28px; }
      main { padding:34px 60px 24px; } header { font-size:25px; } header img { width:48px; height:48px; }
      .connection { padding-top:0; } #primary { width:164px; height:164px; } #primary .icon { width:64px; height:64px; }
      h1 { font-size:28px; margin-top:25px; } #notice { font-size:21px; margin-top:12px; height:29px; }
      .traffic { margin-top:20px; } .traffic-cell { font-size:24px; } .traffic-cell .icon { width:24px; height:24px; margin-right:12px; }
      .icon-button { width:70px; height:70px; border-radius:17px; } .icon-button .icon { width:30px; height:30px; }
      .caption { font-size:21px; margin-top:12px; } .overlay { padding:36px 60px; } .panel { padding:32px 44px; }
      h2 { font-size:34px; margin-bottom:28px; } .panel-actions { margin-top:26px; } #log-panel { height:100%; }
      #log-output { font-size:21px; } .setting-row { font-size:24px; min-height:76px; padding:16px 22px; margin-bottom:12px; }
      #settings .panel { padding:28px 40px; } #settings h2 { margin-bottom:20px; } #settings .panel-actions { margin-top:14px; padding-bottom:36px; }
      .routing-info { font-size:18px; margin-bottom:12px; padding-left:22px; } .routing-info .icon-button { width:48px; height:48px; }
      .upload-url { font-size:30px; } .upload-pin { margin:24px 0; } .upload-pin code { font-size:44px; }
    }
  </style>
</head>
<body>
  <main id="home">
    <header><img src="largeIcon.png" alt=""><span>AmneziaWG</span></header>
    <section class="connection" aria-label="VPN">
      <button id="primary" aria-label="Check VPN status"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M12 2v10" />
  <path d="M18.4 6.6a9 9 0 1 1-12.77.04" />
</svg></button>
      <h1 id="state" role="status">Checking…</h1>
      <p id="notice" aria-live="polite"></p>
      <div class="traffic" id="traffic" data-i18n-aria="traffic" aria-label="VPN traffic">
        <div class="traffic-cell" id="received-cell" data-i18n-aria="received" aria-label="Downloaded"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M12 5v14" />
  <path d="m19 12-7 7-7-7" />
</svg><span id="received">—</span></div>
        <div class="traffic-cell" id="sent-cell" data-i18n-aria="sent" aria-label="Uploaded"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m5 12 7-7 7 7" />
  <path d="M12 19V5" />
</svg><span id="sent">—</span></div>
      </div>
    </section>
    <nav class="toolbar" data-i18n-aria="controls" aria-label="VPN controls">
      <div class="tool"><button id="open-config" class="icon-button" data-i18n-aria="configuration" aria-label="Configuration"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
  <path d="M12 12v6" />
  <path d="m15 15-3-3-3 3" />
</svg></button><span class="caption" aria-hidden="true" data-i18n="configuration">Configuration</span></div>
      <div class="tool"><button id="open-logs" class="icon-button" data-i18n-aria="logs" aria-label="Logs"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M3 5h1" />
  <path d="M3 12h1" />
  <path d="M3 19h1" />
  <path d="M8 5h1" />
  <path d="M8 12h1" />
  <path d="M8 19h1" />
  <path d="M13 5h8" />
  <path d="M13 12h8" />
  <path d="M13 19h8" />
</svg></button><span class="caption" aria-hidden="true" data-i18n="logs">Logs</span></div>
      <div class="tool"><button id="open-settings" class="icon-button" data-i18n-aria="settings" aria-label="Settings"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
  <circle cx="12" cy="12" r="3" />
</svg></button><span class="caption" aria-hidden="true" data-i18n="settings">Settings</span></div>
    </nav>
  </main>
  <section id="config" class="overlay" role="dialog" aria-modal="true" aria-labelledby="config-title" hidden>
    <div class="panel">
      <h2 id="config-title" data-i18n="configuration">Configuration</h2>
      <p id="import-note"></p>
      <div id="upload-details" hidden>
        <code id="upload-url" class="upload-url"></code>
        <div class="upload-pin"><span data-i18n="uploadCode">Code</span><code id="upload-code"></code></div>
      </div>
      <p id="upload-message" role="status"></p>
      <div class="panel-actions">
        <div class="tool"><button id="config-back" class="icon-button" data-i18n-aria="back" aria-label="Back"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m15 18-6-6 6-6" />
</svg></button><span class="caption" aria-hidden="true" data-i18n="back">Back</span></div>
        <div class="tool" id="upload-open-tool"><button id="import" class="icon-button" data-i18n-aria="uploadOpen" aria-label="Open upload"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
  <path d="M12 12v6" />
  <path d="m15 15-3-3-3 3" />
</svg></button><span class="caption" aria-hidden="true" data-i18n="uploadOpen">Open upload</span></div>
      </div>
    </div>
  </section>
  <section id="logs" class="overlay" role="dialog" aria-modal="true" aria-labelledby="logs-title" hidden>
    <div class="panel" id="log-panel">
      <h2 id="logs-title" data-i18n="logs">Logs</h2>
      <pre id="log-output" data-i18n="loading">Loading…</pre>
      <div class="panel-actions">
        <div class="tool"><button id="refresh-logs" class="icon-button" data-i18n-aria="refreshLogs" aria-label="Refresh logs"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
  <path d="M8 16H3v5" />
</svg></button><span class="caption" aria-hidden="true" data-i18n="refresh">Refresh</span></div>
        <div class="tool"><button id="logs-back" class="icon-button" data-i18n-aria="back" aria-label="Back"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m15 18-6-6 6-6" />
</svg></button><span class="caption" aria-hidden="true" data-i18n="back">Back</span></div>
      </div>
    </div>
  </section>
  <section id="settings" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="panel">
      <h2 id="settings-title" data-i18n="settings">Settings</h2>
      <button id="autostart" class="setting-row" role="switch" aria-checked="false"><span data-i18n="startup">Connect on device startup</span><span class="switch" aria-hidden="true"></span></button>
      <button id="routing" class="setting-row" role="switch" aria-checked="false"><span data-i18n="ruDirect">Russian services directly</span><span class="switch" aria-hidden="true"></span></button>
      <div id="routing-info" class="routing-info" hidden><span id="routing-summary"></span><button id="routing-refresh" class="icon-button" data-i18n-aria="routingRefresh" aria-label="Update subnet list"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
  <path d="M8 16H3v5" />
</svg></button></div>
      <button id="language" class="setting-row"><span data-i18n="language">Language</span><span id="language-value" class="language-value">English</span></button>
      <p id="settings-notice" role="status"></p>
      <div class="panel-actions">
        <div class="tool"><button id="settings-back" class="icon-button" data-i18n-aria="back" aria-label="Back"><svg class="icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m15 18-6-6 6-6" />
</svg></button><span class="caption" aria-hidden="true" data-i18n="back">Back</span></div>
      </div>
    </div>
  </section>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
